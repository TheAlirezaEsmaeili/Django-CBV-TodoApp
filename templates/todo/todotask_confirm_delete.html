<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            text-align: center;
        }
        a{
            text-decoration: none;
        }
        p{
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Delete Task</h1>
    <hr>
    <p>Are you sure you want to delete "{{ object.title }}" ?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{% url 'todoapp:todotask' %}">Cancel</a>
</body>

</html>
